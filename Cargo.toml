[workspace]
resolver = "2"
members = [
    "crates/bourbaki-ir",
    "crates/bourbaki-kernel",
    "crates/bourbaki-mesh",
    "crates/kernel",
    "crates/kernel-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["BourbakiMesh Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/tryggth/bourbakimesh"
readme = "README.md"
keywords = ["theorem-proving", "game-semantics", "lean4", "mcts", "cic"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
thiserror = "1.0"
tokio = { version = "1.38", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
bytes = "1.6"
proptest = "1.5"
sha2 = "0.10"
hex = "0.4"
criterion = "0.5"
clap = { version = "4.5", features = ["derive"] }
